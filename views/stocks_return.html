
<section class="panel" id="panel-stocks_return" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Stocks Return</h1>
      <p class="text-muted mb-0">Unused stock returned by an internal requester back into inventory.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#sreturnModal" data-module="stocks_return"><i class="bi bi-plus-lg me-1"></i>New Stocks Return</button>
  </div>
  <div class="card gym-table-container shadow-sm">
    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
      <h6 class="mb-0 gw-section-title">All Stocks Returns</h6>
      <small class="text-muted">Internal stock return records</small>
    </div>
    <div class="table-responsive gym-table-scroll">
      <table class="table gym-table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Requested By</th><th>Processed By</th><th>Date</th><th>Reason</th><th>Items</th></tr>
        </thead>
        <tbody id="sreturnTable"></tbody>
      </table>
    </div>
    <div class="d-md-none p-2 p-sm-3" id="sreturnMobileList"></div>
  </div>
</section>

<div class="modal fade" id="sreturnModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <form id="sreturnForm">
        <div class="modal-header">
          <h5 class="modal-title">New Stocks Return</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-12 col-md mb-3">
              <label class="form-label" for="sreturn_requested_by">Requested By</label>
              <input type="text" class="form-control" id="sreturn_requested_by" required placeholder="Branch name or requesting personnel">
            </div>
            <div class="col-12 col-md mb-3">
              <label class="form-label" for="sreturn_user_id">Processed By</label>
              <select class="form-select" id="sreturn_user_id" required></select>
            </div>
            <div class="col-12 col-md mb-3">
              <label class="form-label" for="sreturn_date">Return Date</label>
              <input type="date" class="form-control" id="sreturn_date" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="sreturn_reason">Reason</label>
            <input type="text" class="form-control" id="sreturn_reason" placeholder="Enter reason for returning stock to inventory">
          </div>
          <hr>
          <div class="row g-2 align-items-end">
            <div class="col-12 col-sm-7">
              <label class="form-label" for="sreturn_item_product">Product</label>
              <select class="form-select" id="sreturn_item_product"></select>
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label" for="sreturn_item_qty">Qty</label>
              <input type="number" class="form-control" id="sreturn_item_qty" min="1" value="1">
            </div>
            <div class="col-6 col-sm-2">
              <button type="button" class="btn btn-outline-dark w-100" onclick="addLineItem('sreturn')">Add</button>
            </div>
          </div>
          <div class="table-responsive gym-table-scroll">
            <table class="table gym-table table-sm mt-3">
              <thead><tr><th>Product</th><th>Qty</th><th></th></tr></thead>
              <tbody id="sreturn_items_table"></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Stocks Return</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-sreturn">
  <tr>
    <td><strong class="row-by-customer"></strong></td>
    <td class="row-by-staff"></td>
    <td class="row-date"></td>
    <td class="row-reason"></td>
    <td class="row-items"></td>
  </tr>
</template>
