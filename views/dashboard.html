<section class="panel active" id="panel-dashboard">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-3">
    <div>
      <div class="d-flex align-items-center gap-2">
        <h1 class="h3 mb-0 fw-bold" id="dashboardTitle">Dashboard</h1>
        <span class="badge bg-dark-subtle text-dark border fw-semibold" id="dashboardRolePill" hidden></span>
      </div>
      <p class="text-muted mb-0 small mt-1" id="dashboardSubtitle">Overview of warehouse operations and daily responsibilities.</p>
    </div>
    <div class="d-flex flex-wrap align-items-center gap-2" id="dashboardHeaderActions"></div>
  </div>

  <!-- Role-specific KPI cards -->
  <div class="row g-3 mb-4" id="statGrid"></div>

  <!-- Role-specific operational workspace -->
  <div id="dashboardRoleContent"></div>
</section>

<!-- Store Requester: All Purchase Requests Modal -->
<div class="modal fade" id="requesterRequestsModal" tabindex="-1" aria-labelledby="requesterRequestsModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-file-earmark-text text-primary fs-5"></i>
          <h5 class="modal-title fw-bold mb-0" id="requesterRequestsModalTitle">My Purchase Requests</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3 p-md-4">
        <!-- Search and Filter Bar -->
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-7">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
              <input type="search" class="form-control" id="requesterModalSearchInput" placeholder="Search by request number, items, or purpose..." oninput="handleRequesterModalSearch()">
            </div>
          </div>
          <div class="col-12 col-md-5">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white"><i class="bi bi-funnel text-muted"></i></span>
              <select class="form-select" id="requesterModalStatusFilter" onchange="handleRequesterModalStatusFilter()">
                <option value="all">All Request Statuses</option>
                <option value="Pending">Pending Approval</option>
                <option value="Approved">Approved / In Fulfillment</option>
                <option value="For Revision">Returned for Revision</option>
                <option value="Rejected">Rejected</option>
                <option value="Completed">Completed</option>
                <option value="Draft">Draft</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Requests Table -->
        <div class="table-responsive border rounded-3">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light small text-secondary">
              <tr>
                <th class="ps-3">Request No.</th>
                <th>Destination</th>
                <th>Items Summary</th>
                <th class="text-center">Total Qty</th>
                <th class="text-center">Status</th>
                <th>Submitted</th>
                <th class="text-end pe-3">Action</th>
              </tr>
            </thead>
            <tbody id="requesterModalTableBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer d-flex justify-content-between align-items-center">
        <div class="text-muted small" id="requesterModalPaginationInfo">Showing 0 of 0 requests</div>
        <div class="d-flex align-items-center gap-1" id="requesterModalPaginationControls"></div>
      </div>
    </div>
  </div>
</div>
