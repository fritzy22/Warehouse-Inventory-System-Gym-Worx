
<section class="panel" id="panel-supplier" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Suppliers</h1>
      <p class="text-muted mb-0">Vendors the warehouse orders stock from.</p>
    </div>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#supplierModal" data-module="supplier"><i class="bi bi-plus-lg me-1"></i>Add Supplier</button>
  </div>
  <div class="card gym-table-container shadow-sm">
    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
      <h6 class="mb-0 gw-section-title">All Suppliers</h6>
      <small class="text-muted">Registered warehouse vendors and contact directory</small>
    </div>
    <div class="table-responsive gym-table-scroll">
      <table class="table gym-table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Supplier Name</th><th>Contact Person</th><th>Phone</th><th>Email</th><th>Status</th><th class="text-end text-nowrap">Actions</th></tr>
        </thead>
        <tbody id="supplierTable"></tbody>
      </table>
    </div>
    <div class="d-md-none p-2 p-sm-3" id="supplierMobileList"></div>
  </div>
</section>

<div class="modal fade" id="supplierModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <form id="supplierForm">
        <div class="modal-header">
          <h5 class="modal-title" id="supplierModalTitle">Add Supplier</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="supplier_id">
          <div class="mb-3">
            <label class="form-label" for="supplier_name">Supplier Name</label>
            <input type="text" class="form-control" id="supplier_name" required placeholder="Enter supplier name">
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact_person">Contact Person</label>
            <input type="text" class="form-control" id="contact_person" placeholder="Full name of contact representative">
          </div>
          <div class="row">
            <div class="col-12 col-sm mb-3">
              <label class="form-label" for="phone">Phone</label>
              <input type="text" class="form-control" id="phone" placeholder="e.g. 0917-123-4567 or (088) 123-4567">
            </div>
            <div class="col-12 col-sm mb-3">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" placeholder="name@supplier.com">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <textarea class="form-control" id="address" rows="2" placeholder="Street, City"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Save Supplier</button>
        </div>
      </form>
    </div>
  </div>
</div>

<template id="tmpl-row-supplier">
  <tr>
    <td><strong class="row-name"></strong></td>
    <td class="row-contact"></td>
    <td class="row-phone"></td>
    <td class="row-email"></td>
    <td class="row-status"></td>
    <td class="text-end text-nowrap row-actions"></td>
  </tr>
</template>
