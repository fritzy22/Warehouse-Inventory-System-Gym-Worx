<section class="panel" id="panel-notifications" hidden>
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-end gap-2 mb-3">
    <div>
      <h1 class="h3 mb-1">Notifications &amp; Alerts</h1>
      <p class="text-muted mb-0 small">Real-time system alerts for purchase requests, manager approvals, purchase orders, deliveries, and low-stock thresholds.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <div class="btn-group btn-group-sm" role="group" aria-label="Notification filter">
        <button type="button" class="btn btn-dark" id="notifFilterAll" onclick="loadNotificationsPanel(false)">All</button>
        <button type="button" class="btn btn-outline-secondary" id="notifFilterUnread" onclick="loadNotificationsPanel(true)">Unread Only</button>
      </div>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="markAllNotificationsRead()">
        <i class="bi bi-check2-all me-1"></i>Mark All as Read
      </button>
    </div>
  </div>

  <div class="card">
    <div class="list-group list-group-flush" id="notificationsFullList">
      <div class="p-4 text-center text-muted fst-italic">Loading notifications...</div>
    </div>
  </div>
</section>
