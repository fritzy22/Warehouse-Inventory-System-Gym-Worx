
<section class="panel" id="panel-inventory_report" hidden>
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-end gap-2 mb-3">
    <div>
      <h1 class="h3">Inventory Report</h1>
      <p class="text-muted mb-0">Current quantity on hand for all products.</p>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <label class="visually-hidden" for="inventoryFilterCategory">Filter by category</label>
      <select class="form-select form-select-sm w-auto" id="inventoryFilterCategory">
        <option value="">All Categories</option>
      </select>
      <button class="btn btn-success btn-print-action btn-sm text-nowrap" id="btnInventoryReportPrint" onclick="openInventoryReportModal()"><i class="bi bi-printer me-1"></i>Print / Preview Report</button>
    </div>
  </div>

  <div class="row g-3 mb-3" id="inventorySummary">
    <div class="col-12 col-sm-6">
      <div class="card h-100">
        <div class="card-body">
          <div class="text-muted small">Total Quantity on Hand</div>
          <div class="fs-4 fw-bold font-monospace text-break" id="inventoryTotalQty">0</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6">
      <div class="card h-100">
        <div class="card-body">
          <div class="text-muted small">Estimated Value</div>
          <div class="fs-4 fw-bold font-monospace text-break" id="inventoryEstimatedValue">PHP 0.00</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card gym-table-container shadow-sm">
    <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
      <h6 class="mb-0 gw-section-title">Current Inventory Valuation &amp; Stock Status</h6>
      <small class="text-muted">Live warehouse stock summary and reorder metrics</small>
    </div>
    <div class="table-responsive gym-table-scroll">
      <table class="table gym-table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Product Name</th><th>Category</th><th>Unit</th><th>Unit Price</th><th>Qty on Hand</th><th>Reorder Level</th><th>Stock Status</th></tr>
        </thead>
        <tbody id="inventoryReportTable"></tbody>
      </table>
    </div>
  </div>
</section>

<template id="tmpl-row-inventory">
  <tr>
    <td><strong class="row-name"></strong></td>
    <td class="row-cat"></td>
    <td class="row-unit"></td>
    <td class="font-monospace row-price"></td>
    <td class="font-monospace row-stock"></td>
    <td class="row-reorder"></td>
    <td class="row-status-indicator"></td>
  </tr>
</template>
